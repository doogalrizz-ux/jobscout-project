name: Daily scan

on:
  schedule:
    # GitHub sometimes delays or drops scheduled runs (especially on the hour), so there are two:
    # the second only scans if the first didn't publish today's data.
    - cron: "23 9 * * *"    # 09:23 UTC = 5:23 AM Eastern (4:23 in winter)
    - cron: "23 11 * * *"   # backup
  workflow_dispatch:
    inputs:
      discover:
        description: "Refresh the company registry first, including Common Crawl (slow: can take an hour+)"
        type: boolean
        default: false

permissions:
  contents: write   # commit registry updates
  pages: write
  id-token: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.fresh.outputs.skip }}
    steps:
      - id: fresh
        name: Skip scheduled runs if today's data is already published
        run: |
          url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/jobs.json"
          published=$(curl -fsS "$url" | python3 -c "import json,sys; print(json.load(sys.stdin)['generated'][:10])" || echo none)
          echo "published: $published, today: $(date -u +%F)"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$published" = "$(date -u +%F)" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  scan:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Workday/SmartRecruiters job details, so each job is fetched only once
      - uses: actions/cache@v4
        with:
          path: state
          key: details-${{ github.run_id }}
          restore-keys: details-

      # Mondays: quick refresh from HN + seeds.txt. On request: full refresh including Common Crawl.
      - name: Refresh company registry
        run: |
          if [ "${{ inputs.discover }}" = "true" ]; then
            python -m jobscout discover
          elif [ "$(date +%u)" = "1" ]; then
            python -m jobscout discover --no-common-crawl
          fi
          if [ -n "$(git status --porcelain registry)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add registry
            git commit -m "Refresh company registry"
            git push
          fi

      - name: Scan boards and build dataset
        run: |
          python -m jobscout publish public \
            --prev-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/jobs.json"
          cp web/index.html public/index.html
          du -sh public/data

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
